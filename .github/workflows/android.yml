name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.CAPITOL_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.CAPITOL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/capitol.jks"
          echo "CAPITOL_KEYSTORE_PATH=$RUNNER_TEMP/capitol.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CAPITOL_KEYSTORE_PASSWORD: ${{ secrets.CAPITOL_KEYSTORE_PASSWORD }}
          CAPITOL_KEY_ALIAS: ${{ secrets.CAPITOL_KEY_ALIAS }}
          CAPITOL_KEY_PASSWORD: ${{ secrets.CAPITOL_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "capitol-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: capitol-apk
          path: capitol-*.apk

      # Publishing a GitHub Release is what the in-app updater looks for.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: capitol-*.apk
          generate_release_notes: true
